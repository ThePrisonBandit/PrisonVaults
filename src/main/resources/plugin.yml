name: PrisonVaults
version: '1.0.8'
main: me.theprisonbandit.prisonVaults.PrisonVaults
api-version: '1.21'
prefix: !
load: STARTUP
authors: [ ThePrisonBandit ]
description: Vaults for minecraft prisons!
commands:
  pv:
    description: Open a personal vault
    usage: /pv <number>
  sell:
    description: Sell items to the server
    usage: /sell or /sell all
    aliases: [s]
  balance:
    description: Check your PrisonBucks
    usage: /balance or /bal or /money
    aliases: [bal, money]
  rankup:
    description: Rank up to the next level
    usage: /rankup
  addmoney:
    description: Give money to a player
    usage: /addmoney <player> <amount>
  colorify:
    description: Set a gradient name color
    usage: /colorify <preset>
    aliases: [colorname, color]
  kit:
    description: Get a kit
    usage: /kit <name>
  kits:
    description: List kits
    usage: /kits
  createkit:
    description: Admin create kit
    usage: /createkit <name> <color> <tool> <armor> <enchant> <price>
  buykit:
    description: Open kit shop
    usage: /buykit
  gang:
    description: Main gang command
    usage: /gang
  mail:
    description: Send mail
    usage: /mail <gang> or <gang member>
  inbox:
    description: Check mail
    usage: /inbox
  gangs:
    description: List all gangs on the server
    usage: /gangs
  prisonvaults:
    description: Reload all configuration files
    usage: /prisonvaults reload
  pay:
    description: Send money to others
    usage: /pay <player> <amount>]
  rob:
    description: Attempt to rob a player (Very low chance!)
    usage: /rob <player>
  job:
    description: Join or quit jobs
    usage: /job <join|quit|shop|info|promote>
  myprofile:
    description: View your stats
    usage: /myprofile
  whois:
    description: View another player's stats
    usage: /whois <player>
  setbio:
    description: Set your profile biography
    usage: /setbio <text>
    aliases: [ setdesc ]
  setdesc:
    description: Alias for setbio
    usage: /setdesc <text>
  pvconfig:
    description: Open the prisonvaults config file and edit it
    usage: /pvconfig
  pvscoreboard:
    description: Toggle the prisonvaults scoreboard
    usage: /pvscoreboard
  pvshop:
    description: Open the job ingredient shops.
    usage: /pvshop <messhall|smithy>
    aliases: [ jobshop ]
  pvhelp:
    description: List all plugin commands.
    usage: /pvhelp [page]
  staff:
    description: Open the Staff Management GUI
    usage: /staff
    permission: prisonvaults.staff.manage
  staffmail:
    description: Check staff notifications
    usage: /staffmail <read|clear>
    permission: prisonvaults.staff
  setstaff:
    description: Set a player's staff rank directly
    usage: /setstaff <player> <rank>
    permission: prisonvaults.admin

permissions:
  prisonvaults.use:
    default: true
  prisonvaults.admin:
    description: Allows use of admin commands like /addmoney and /setstaff
    default: op
  prisonvaults.addmoney:
    description: Allows giving money to players
    default: op
  prisonvaults.colorify:
    description: Allows changing name colors
    default: true
  prisonvaults.createkit:
    description: Allows creating kits
    default: op
  prisonvaults.sell:
    description: Allows selling items to the server
    default: true
  prisonvaults.rankup:
    description: Allows ranking up
    default: true
  prisonvaults.kit:
    description: Allows using kits
    default: true
  prisonvaults.gang:
    description: Allows gang commands
    default: true
  prisonvaults.mail:
    description: Allows sending mail
    default: true
  prisonvaults.inbox:
    description: Allows checking mail
    default: true
  prisonvaults.gangs:
    description: Allows listing gangs
    default: true
  prisonvaults.pay:
    description: Allows paying other players
    default: true
  prisonvaults.balance:
    description: Allows checking balance
    default: true
  prisonvaults.buykit:
    description: Allows buying kits
    default: true
  prisonvaults.reload:
    description: Allows reloading the plugin configuration
    default: op
  prisonvaults.rob:
    description: Allows robbing other players
    default: true
  prisonvaults.pv:
    description: Allows opening personal vaults
    default: true
  prisonvaults.pickpocket:
    description: Allows pickpocketing other players
    default: true
  prisonvaults.job:
    description: Allows joining and quitting jobs
    default: true
  prisonvaults.myprofile:
    description: Allows viewing your profile
    default: true
  prisonvaults.whois:
    description: Allows viewing other players' profiles
    default: true
  prisonvaults.setbio:
    description: Allows setting your profile biography
    default: true
  prisonvaults.setdesc:
    description: Alias for setbio permission
    default: true
  prisonvaults.pvconfig:
    description: Allows opening and editing the prisonvaults config file
    default: op
  prisonvaults.pvscoreboard:
    description: Allows toggling the prisonvaults scoreboard
    default: true
  prisonvaults.pvshop:
    description: Allows opening job ingredient shops
    default: true
  prisonvaults.pvhelp:
    description: Allows listing all plugin commands
    default: true
  prisonvaults.staff:
    description: Base permission for staff members (mail, chat prefix)
    default: op
  prisonvaults.staff.manage:
    description: Allows opening the Staff Management GUI
    default: op