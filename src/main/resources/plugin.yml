name: PrisonVaults
version: '1.1.1'
main: me.theprisonbandit.prisonVaults.PrisonVaults
api-version: '1.21'
prefix: !
load: STARTUP
authors: [ ThePrisonBandit ]
description: Vaults for minecraft prisons!
commands:
  pv:
    description: Open a personal vault
    usage: /pv <number>
  sell:
    description: Sell items to the server
    usage: /sell or /sell all
    aliases: [s]
  balance:
    description: Check your PrisonBucks
    usage: /balance or /bal or /money
    aliases: [bal, money]
  rankup:
    description: Rank up to the next level
    usage: /rankup
  addmoney:
    description: Give money to a player
    usage: /addmoney <player> <amount>
  colorify:
    description: Set a gradient name color
    usage: /colorify <preset>
    aliases: [colorname, color]
  kit:
    description: Get a kit
    usage: /kit <name>
  kits:
    description: List kits
    usage: /kits
  createkit:
    description: Admin create kit
    usage: /createkit <name> <color> <tool> <armor> <enchant> <price>
  buykit:
    description: Open kit shop
    usage: /buykit
  gang:
    description: Main gang command
    usage: /gang
  mail:
    description: Send mail
    usage: /mail <gang> or <gang member>
  inbox:
    description: Check mail
    usage: /inbox
  gangs:
    description: List all gangs on the server
    usage: /gangs
  prisonvaults:
    description: Reload all configuration files
    usage: /prisonvaults reload
  pay:
    description: Send money to others
    usage: /pay <player> <amount>]
  rob:
    description: Attempt to rob a player (Very low chance!)
    usage: /rob <player>
  job:
    description: Join or quit jobs
    usage: /job <join|quit|shop|info|promote>
  myprofile:
    description: View your stats
    usage: /myprofile
  whois:
    description: View another player's stats
    usage: /whois <player>
  setbio:
    description: Set your profile biography
    usage: /setbio <text>
    aliases: [ setdesc ]
  setdesc:
    description: Alias for setbio
    usage: /setdesc <text>
  pvconfig:
    description: Open the prisonvaults config file and edit it
    usage: /pvconfig
  pvscoreboard:
    description: Toggle the prisonvaults scoreboard
    usage: /pvscoreboard
  pvshop:
    description: Open the job ingredient shops.
    usage: /pvshop <messhall|smithy>
    aliases: [ jobshop ]
  pvhelp:
    description: List all plugin commands.
    usage: /pvhelp [page]
  staff:
    description: Open the Staff Management GUI
    usage: /staff
    permission: prisonvaults.staff.manage
  staffmail:
    description: Check staff notifications
    usage: /staffmail <read|clear>
    permission: prisonvaults.staff
  setstaff:
    description: Set a player's staff rank directly (OP ONLY)
    usage: /setstaff <player> <rank>
    permission: prisonvaults.setstaff
  pvkick:
    description: Kick a player (Owners protected)
    usage: /pvkick <player> [reason]
    permission: prisonvaults.kick
  pvban:
    description: Ban a player (Owners protected)
    usage: /pvban <player> [reason]
    permission: prisonvaults.ban
  pvwarn:
    description: Warn a player
    usage: /pvwarn <player> <reason>
    permission: prisonvaults.warn
  pvpardon:
    description: Unban a player
    usage: /pvpardon <player>
    permission: prisonvaults.pardon
  # NEW PERM COMMAND
  pvperm:
    description: Manage PrisonVaults permissions
    usage: /pvperm <args>
    permission: prisonvaults.op
  # NEW COMPASS COMMAND
  pvcompass:
    description: Open the prisonvaults compass GUI
    usage: /pvcompass
  pvinfo:
    description: View plugin version and update status
    usage: /pvinfo
    permission: prisonvaults.info
  staffchat:
    description: Toggle staff chat or send message
    usage: /sc [msg]
    aliases: [ sc ]
    permission: prisonvaults.staffchat # FIXED: Matched to specific permission node
  gangchat:
    description: Toggle gang chat or send message
    usage: /gc [msg]
    aliases: [ gc ]
  pets:
    description: Open your pet selector
    usage: /pets
  petshop:
    description: Open the pet shop
    usage: /petshop
  resetcooldown:
    description: Reset all cooldowns for the server
    usage: /resetcooldown
    permission: prisonvaults.resetcooldown
  pvannounce:
    description: Broadcast a message to the server
    usage: /pvannounce <message>
    permission: prisonvaults.admin.announce

permissions:
  # --- BASIC PERMISSIONS (Default: True) ---
  prisonvaults.use:
    default: true
  prisonvaults.colorify:
    default: true
  prisonvaults.sell:
    default: true
  prisonvaults.rankup:
    default: true
  prisonvaults.kit:
    default: true
  prisonvaults.gang:
    default: true
  prisonvaults.mail:
    default: true
  prisonvaults.inbox:
    default: true
  prisonvaults.gangs:
    default: true
  prisonvaults.pay:
    default: true
  prisonvaults.balance:
    default: true
  prisonvaults.buykit:
    default: true
  prisonvaults.rob:
    default: true
  prisonvaults.pv:
    default: true
  prisonvaults.pickpocket:
    default: true
  prisonvaults.job:
    default: true
  prisonvaults.myprofile:
    default: true
  prisonvaults.whois:
    default: true
  prisonvaults.setbio:
    default: true
  prisonvaults.setdesc:
    default: true
  prisonvaults.pvscoreboard:
    default: true
  prisonvaults.pvshop:
    default: true
  prisonvaults.pvhelp:
    default: true
  prisonvaults.pvcompass:
    default: true
  prisonvaults.pvinfo:
    default: true
  prisonvaults.gangchat:
    default: true
  prisonvaults.pets:
    default: true
  prisonvaults.petshop:
    default: true

  # --- STAFF INDIVIDUAL NODES ---
  prisonvaults.warn:
    default: false
  prisonvaults.kick:
    default: false
  prisonvaults.ban:
    default: false
  prisonvaults.pardon:
    default: false
  prisonvaults.staff:
    description: Allows access to staff features
    default: false
  prisonvaults.staff.manage:
    default: false
  prisonvaults.staffmail:
    default: false
  prisonvaults.addmoney:
    default: false
  prisonvaults.createkit:
    default: false
  prisonvaults.reload:
    default: false
  prisonvaults.pvconfig:
    default: false
  prisonvaults.setstaff:
    description: Allows setting staff ranks
    default: false
  prisonvaults.staffchat: # Used by the command now
    default: false
  prisonvaults.resetcooldown:
    default: false
  prisonvaults.admin.announce:
    description: Allows broadcasting server-wide announcements
    default: false
  prisonvaults.pvannounce:
    description: Allows broadcasting server-wide announcements
    default: false

  # --- RANK HIERARCHIES ---

  prisonvaults.helper:
    description: Helper permissions
    default: false
    children:
      prisonvaults.staff: true
      prisonvaults.staffmail: true
      prisonvaults.staffchat: true

  prisonvaults.moderator:
    description: Moderator permissions (Inherits Helper + Kick/Warn)
    default: false
    children:
      prisonvaults.helper: true
      prisonvaults.kick: true
      prisonvaults.warn: true

  prisonvaults.admin:
    description: Admin permissions (Inherits Mod + Ban/Pardon/Staff GUI/Kits)
    default: false
    children:
      prisonvaults.moderator: true
      prisonvaults.ban: true
      prisonvaults.pardon: true
      prisonvaults.createkit: true
      prisonvaults.staff.manage: true
      prisonvaults.reload: true
      prisonvaults.pvconfig: true
      prisonvaults.resetcooldown: true
      prisonvaults.admin.announce: true
      prisonvaults.pvannounce: true

  prisonvaults.coowner:
    description: Co-Owner permissions (Inherits Admin + Money + SetStaff)
    default: false
    children:
      prisonvaults.admin: true
      prisonvaults.addmoney: true
      prisonvaults.setstaff: true

  prisonvaults.owner:
    description: Owner permissions (Inherits Co-Owner + Everything)
    default: false
    children:
      prisonvaults.coowner: true
      prisonvaults.*: true